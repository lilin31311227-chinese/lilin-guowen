<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Navbar</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#fdfaf5;color:#1a365d;font-size:14px;padding:0;min-height:200px}
  .nav{background:rgba(250,245,239,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(26,54,93,.1);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between}
  .logo img{height:40px}
  .links{display:flex;gap:32px;align-items:center}
  .link{color:#1a365d;font-weight:500;transition:color 150ms;text-decoration:none;font-size:14px}
  .link:hover, .link.active{color:#d69e2e}
  .cta{display:inline-flex;align-items:center;gap:.4rem;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#0A1A35;padding:.625rem 1.25rem;border-radius:.5rem;font-weight:600;font-size:13.5px;box-shadow:0 4px 12px rgba(214,158,46,.3)}
  .below{padding:36px 32px 0;font-size:12.5px;color:#2c5282}
  .lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#1a365d;opacity:.55;font-weight:600;margin-bottom:6px}
</style>
</head>
<body>
  <nav class="nav">
    <a href="#" class="logo"><img src="../assets/lilin-logo.png" alt="立霖國文"></a>
    <div class="links">
      <a href="#" class="link active">學生入口</a>
      <a href="#" class="link">家長入口</a>
      <a href="#" class="link">心靈專欄</a>
      <a href="#" class="link">體驗活動</a>
      <a href="#" class="cta">免費診斷</a>
    </div>
  </nav>
  <div class="below">
    <div class="lbl">Navbar · fixed top · 64px · cream/95 backdrop-blur</div>
    Hover/active 連結由 navy 轉金 `#d69e2e`，200ms transition。手機收合為漢堡 menu。
  </div>
</body>
</html>
