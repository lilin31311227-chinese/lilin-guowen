<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Mentor Warmth (Parent Track)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#faf5ef;color:#1a365d;padding:24px;font-size:13px}
  .label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#b86a4a;font-weight:600;margin-bottom:10px}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .swatch{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(26,54,93,.08)}
  .chip{height:74px;display:flex;align-items:flex-end;padding:10px 12px;color:rgba(255,255,255,.92);font-size:11px;font-weight:600}
  .chip.light{color:#1a365d}
  .meta{padding:10px 12px 12px}
  .name{font-size:13px;font-weight:700;color:#1a365d}
  .hex{font-size:11px;color:#2c5282;font-family:ui-monospace,Menlo,monospace;margin-top:2px}
  .var{font-size:10.5px;color:#b7791f;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
  <div class="label">人生導師暖色 · 家長軌</div>
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:#b86a4a">赤茶 Terracotta</div>
      <div class="meta"><div class="name">赤茶</div><div class="hex">#b86a4a</div><div class="var">--mentor-terracotta</div></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#c98a3d">琥珀 Amber</div>
      <div class="meta"><div class="name">琥珀</div><div class="hex">#c98a3d</div><div class="var">--mentor-amber</div></div>
    </div>
    <div class="swatch">
      <div class="chip light" style="background:#e8d5c4">陶土 Clay</div>
      <div class="meta"><div class="name">暖陶土</div><div class="hex">#e8d5c4</div><div class="var">--mentor-clay</div></div>
    </div>
    <div class="swatch">
      <div class="chip light" style="background:#f4e4d4">朝陽米</div>
      <div class="meta"><div class="name">朝陽米</div><div class="hex">#f4e4d4</div><div class="var">--mentor-sunrise</div></div>
    </div>
  </div>
</body>
</html>
