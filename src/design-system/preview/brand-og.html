<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>OG Image</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#faf5ef;color:#1a365d;padding:18px;font-size:12px}
  .lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#1a365d;opacity:.55;font-weight:600;margin-bottom:10px}
  .row{display:grid;grid-template-columns:1fr 200px;gap:18px;align-items:start}
  .frame{border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(26,54,93,.1);position:relative}
  .frame img{width:100%;display:block}
  .meta{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 8px rgba(26,54,93,.08);display:flex;flex-direction:column;gap:10px;font-size:12px}
  .meta .k{font-size:10.5px;color:#b7791f;letter-spacing:.05em;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;font-weight:600}
  .meta .v{color:#2c5282;line-height:1.5}
</style>
</head>
<body>
  <div class="lbl">Open Graph 分享卡 · 1200×630</div>
  <div class="row">
    <div class="frame"><img src="../assets/og-image.png" alt="lilin og image"></div>
    <div class="meta">
      <div><div class="k">Asset</div><div class="v">assets/og-image.png</div></div>
      <div><div class="k">Size</div><div class="v">1200 × 630</div></div>
      <div><div class="k">Use</div><div class="v">og:image, twitter:image, FB / IG 分享卡</div></div>
      <div><div class="k">Style</div><div class="v">深藍 hero 底 + 金色渾天儀 + 老師形象照</div></div>
    </div>
  </div>
</body>
</html>
