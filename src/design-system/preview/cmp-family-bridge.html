<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Family Bridge Card</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#faf5ef;color:#1a365d;padding:24px;font-size:13px}
  .lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#4a7c7e;font-weight:600;margin-bottom:12px}
  .card{background:#e8eeec;border:1px solid rgba(74,124,126,.25);border-radius:16px;padding:20px;position:relative;overflow:hidden}
  .card::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#4a7c7e,#9cae8e)}
  .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .pill{display:inline-flex;align-items:center;gap:.4rem;font-size:11.5px;font-weight:600;letter-spacing:.05em;color:#4a7c7e}
  .pill::before{content:"";width:.5rem;height:.5rem;border-radius:9999px;background:#4a7c7e}
  .date{font-size:11.5px;color:#2c5282;opacity:.7}
  .body{font-size:13px;line-height:1.75;margin-bottom:10px}
  .b1 b{color:#4a7c7e;font-weight:600}
  .quote{font-size:12.5px;line-height:1.7;color:#2c5282;font-style:italic;border-left:2px solid #9cae8e;padding-left:12px;margin-bottom:10px}
  .b3 b{color:#b86a4a;font-weight:600}
  .ft{margin-top:14px;padding-top:12px;border-top:1px solid rgba(74,124,126,.15);display:flex;justify-content:space-between;font-size:11.5px}
  .ft .who{color:#2c5282}
  .ft .brand{color:#4a7c7e;font-weight:500}
</style>
</head>
<body>
  <div class="lbl">親情橋樑卡 · FamilyBridgeCard</div>
  <div class="card">
    <div class="hdr">
      <span class="pill">親情橋樑 · 課堂觀察</span>
      <time class="date">2026-05-12</time>
    </div>
    <p class="body b1"><b>今日課堂：</b>討論《紅樓夢》中角色面對家族衰敗的態度，孩子的見解非常深刻，展現了極高的同理心與抗壓潛力。</p>
    <p class="quote">連結文本：《紅樓夢》第七十四回</p>
    <p class="body b3"><b>給家長的建議：</b>今晚可與孩子聊聊她對未來挑戰的看法，並給予肯定。不需要解答，只需要傾聽。</p>
    <div class="ft"><span class="who">立霖 老師</span><span class="brand">立霖國文 · 橋樑互動</span></div>
  </div>
</body>
</html>
