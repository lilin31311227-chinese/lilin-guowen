<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Bridge Tone (Student Track)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#faf5ef;color:#1a365d;padding:24px;font-size:13px}
  .label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#4a7c7e;font-weight:600;margin-bottom:10px}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .swatch{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(26,54,93,.08)}
  .chip{height:74px;display:flex;align-items:flex-end;padding:10px 12px;color:rgba(255,255,255,.92);font-size:11px;font-weight:600}
  .chip.light{color:#1a365d}
  .meta{padding:10px 12px 12px}
  .name{font-size:13px;font-weight:700;color:#1a365d}
  .hex{font-size:11px;color:#2c5282;font-family:ui-monospace,Menlo,monospace;margin-top:2px}
  .var{font-size:10.5px;color:#b7791f;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
  <div class="label">親情橋樑連結色 · 學生軌</div>
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:#4a7c7e">湖青 Teal</div>
      <div class="meta"><div class="name">湖青</div><div class="hex">#4a7c7e</div><div class="var">--bridge-teal</div></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#9cae8e">苔綠 Sage</div>
      <div class="meta"><div class="name">苔綠</div><div class="hex">#9cae8e</div><div class="var">--bridge-sage</div></div>
    </div>
    <div class="swatch">
      <div class="chip light" style="background:#e8eeec">霧白 Mist</div>
      <div class="meta"><div class="name">霧白</div><div class="hex">#e8eeec</div><div class="var">--bridge-mist</div></div>
    </div>
  </div>
</body>
</html>
