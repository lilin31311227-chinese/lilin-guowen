<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Sensory Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#faf5ef;color:#1a365d;padding:24px;font-size:13px}
  .label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#1a365d;opacity:.6;font-weight:600;margin-bottom:12px}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .swatch{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(26,54,93,.08)}
  .chip{height:62px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;letter-spacing:.05em;gap:6px}
  .chip .sym{font-size:20px;opacity:.85}
  .meta{padding:8px 12px 10px}
  .name{font-size:12px;font-weight:700;color:#1a365d}
  .hex{font-size:10.5px;color:#2c5282;font-family:ui-monospace,Menlo,monospace;margin-top:1px}
</style>
</head>
<body>
  <div class="label">五感體驗主題色 Sensory Experience</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#7e8c5c"><span class="sym">◐</span>視</div><div class="meta"><div class="name">山嵐</div><div class="hex">#7e8c5c</div></div></div>
    <div class="swatch"><div class="chip" style="background:#6e7d99"><span class="sym">◑</span>聽</div><div class="meta"><div class="name">流水</div><div class="hex">#6e7d99</div></div></div>
    <div class="swatch"><div class="chip" style="background:#c4a574"><span class="sym">◒</span>嗅</div><div class="meta"><div class="name">木質</div><div class="hex">#c4a574</div></div></div>
    <div class="swatch"><div class="chip" style="background:#b86a4a"><span class="sym">◓</span>味</div><div class="meta"><div class="name">焙茶</div><div class="hex">#b86a4a</div></div></div>
    <div class="swatch"><div class="chip" style="background:#9c8579"><span class="sym">○</span>觸</div><div class="meta"><div class="name">樹皮</div><div class="hex">#9c8579</div></div></div>
  </div>
</body>
</html>
