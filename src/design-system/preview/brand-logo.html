<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Logo Lockups</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;font-size:12px;color:#1a365d;background:#faf5ef}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;min-height:230px}
  .pane{padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
  .p1{background:#faf5ef}
  .p2{background:#0A1A35;color:#faf5ef}
  .p3{background:#fff;border:1px dashed rgba(26,54,93,.15)}
  .lbl{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;opacity:.65;font-weight:600}
  .p2 .lbl{color:#fbbf24;opacity:.9}
  .calli{height:54px;width:auto}
  .calli-dark{filter:brightness(0) invert(1)}
  .seal{width:96px;height:96px;border-radius:14px}
  .desc{font-size:11px;opacity:.7;line-height:1.5;max-width:200px}
  .p2 .desc{color:#fde68a;opacity:.7}
</style>
</head>
<body>
  <div class="grid">
    <div class="pane p1">
      <div class="lbl">主 Logo · 淺底</div>
      <img class="calli" src="../assets/lilin-logo.png" alt="立霖國文 calligraphy">
      <div class="desc">書法字「立霖國文」直接用於 cream / 白底</div>
    </div>
    <div class="pane p2">
      <div class="lbl">主 Logo · 深底反白</div>
      <img class="calli calli-dark" src="../assets/lilin-logo.png" alt="立霖國文 calligraphy">
      <div class="desc">filter: brightness(0) invert(1)</div>
    </div>
    <div class="pane p3">
      <div class="lbl">方形圖標 · 社群頭像</div>
      <img class="seal" src="../assets/lilin-icon.png" alt="lilin seal mark">
      <div class="desc">含篆刻「立」+ 祥雲圓環，作 favicon / 頭像</div>
    </div>
  </div>
</body>
</html>
