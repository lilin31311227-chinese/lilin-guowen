<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Display Type Scale</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#faf5ef;color:#1a365d;padding:24px}
  .row{display:grid;grid-template-columns:90px 130px 1fr;gap:18px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(26,54,93,.08)}
  .row:last-child{border-bottom:0}
  .lvl{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:#b7791f;font-weight:600;letter-spacing:.05em}
  .spec{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:#2c5282;opacity:.75}
  .sample{color:#1a365d;letter-spacing:-.015em}
  .h1{font-size:56px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
  .h2{font-size:40px;font-weight:700;line-height:1.2}
  .h3{font-size:24px;font-weight:700;line-height:1.25}
  .lead{font-size:20px;font-weight:400;line-height:1.6;color:#2c5282}
  .gold{background:linear-gradient(90deg,#fcd34d,#f59e0b,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
  <div class="row"><div class="lvl">H1 / Display</div><div class="spec">56 / 36 · 700</div><div class="sample h1">人生沒有 <span class="gold">Google</span></div></div>
  <div class="row"><div class="lvl">H2 / Section</div><div class="spec">40 / 30 · 700</div><div class="sample h2">雙引擎品牌哲學</div></div>
  <div class="row"><div class="lvl">H3 / Card</div><div class="spec">24 / 20 · 700</div><div class="sample h3">導師的旁白</div></div>
  <div class="row"><div class="lvl">Lead</div><div class="spec">20 / 18 · 400</div><div class="sample lead">不只提升分數，更引導人生方向。</div></div>
</body>
</html>
