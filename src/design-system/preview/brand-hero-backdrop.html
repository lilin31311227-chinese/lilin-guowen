<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Hero Backdrop</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;font-size:12px;color:#faf5ef;background:#0A1A35;padding:0;overflow:hidden}
  .hero{position:relative;min-height:280px;background:linear-gradient(135deg,#0A1A35 0%,#0d2341 50%,#071428 100%);padding:34px 28px;overflow:hidden}
  .glow1{position:absolute;top:-100px;right:-50px;width:340px;height:340px;background:radial-gradient(circle,rgba(245,158,11,.18) 0%,rgba(251,191,36,.05) 50%,transparent 100%);border-radius:9999px;filter:blur(40px)}
  .glow2{position:absolute;bottom:-100px;left:-50px;width:280px;height:280px;background:radial-gradient(circle,rgba(59,130,246,.12) 0%,transparent 60%);border-radius:9999px;filter:blur(40px)}
  .lbl{position:relative;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#fbbf24;opacity:.85;font-weight:600;margin-bottom:14px}
  .badge{display:inline-flex;align-items:center;gap:.5rem;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);padding:.4rem .9rem;border-radius:9999px;font-size:11.5px;font-weight:500;color:#fde68a;margin-bottom:14px;position:relative}
  .badge::before{content:"";width:.5rem;height:.5rem;background:#fbbf24;border-radius:9999px}
  h1{position:relative;font-size:38px;font-weight:700;line-height:1.15;letter-spacing:-.015em;color:#fff}
  .gold{background:linear-gradient(90deg,#fcd34d,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{position:relative;font-size:14px;color:#cbd5e1;margin-top:12px;line-height:1.7;max-width:520px}
  .swatches{position:absolute;bottom:14px;left:28px;display:flex;gap:6px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#fde68a;align-items:center}
  .sw{width:18px;height:18px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
</style>
</head>
<body>
  <section class="hero">
    <div class="glow1"></div>
    <div class="glow2"></div>
    <div class="lbl">Hero 漸層底 + 雙徑向暖光</div>
    <span class="badge">素養教學領航者 · 家長與孩子的溝通橋樑</span>
    <h1>不只提升分數<br><span class="gold">更引導人生方向</span></h1>
    <p class="sub">「人生沒有 Google，但有經典可循。」結合考試技巧與素養教育，讓國文成為孩子一生受用的思考武器。</p>
    <div class="swatches">
      <span class="sw" style="background:#0A1A35"></span>#0A1A35
      <span class="sw" style="background:#0d2341"></span>#0d2341
      <span class="sw" style="background:#071428"></span>#071428
      <span style="margin-left:10px">+</span>
      <span class="sw" style="background:radial-gradient(circle,#f59e0b,transparent)"></span>amber glow
    </div>
  </section>
</body>
</html>
