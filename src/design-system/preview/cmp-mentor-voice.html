<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Mentor Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#faf5ef;color:#1a365d;padding:24px;font-size:13px}
  .lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#b86a4a;font-weight:600;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .mv{background:linear-gradient(180deg,#f4e4d4 0%,#e8d5c4 100%);border-left:3px solid #b86a4a;border-radius:0 12px 12px 0;padding:1.5rem 1.75rem}
  .eb{font-size:11px;letter-spacing:.15em;font-weight:600;color:#b86a4a;margin-bottom:8px}
  .body{font-size:15px;line-height:1.75;color:#1a365d}
  .ref{margin-top:14px;padding-top:12px;border-top:1px solid rgba(184,106,74,.2);font-size:12.5px;color:#2c5282}
</style>
</head>
<body>
  <div class="lbl">導師旁白塊 · MentorVoice</div>
  <div class="grid">
    <div class="mv">
      <div class="eb">導師的旁白</div>
      <div class="body">在現代社會中，我們經常面臨各種期待。你認為我們應該對誰展現最大的忠誠？</div>
      <div class="ref">—— 出自 蘇軾《定風波》</div>
    </div>
    <div class="mv">
      <div class="eb">心靈專欄</div>
      <div class="body">「歸去來兮，田園將蕪胡不歸？」陶淵明說的不是辭職，是回到自己。你今天最想回去的，是哪個自己？</div>
      <div class="ref">—— 出自 陶淵明《歸去來辭》</div>
    </div>
  </div>
</body>
</html>
