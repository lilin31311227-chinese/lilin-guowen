<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#faf5ef;color:#1a365d;padding:24px;font-size:12px}
  .lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#1a365d;opacity:.55;font-weight:600;margin:0 0 10px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .group{margin-bottom:18px}
  .group:last-child{margin-bottom:0}
  .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.875rem 1.5rem;border-radius:.5rem;font-weight:600;font-size:14px;border:none;cursor:pointer;font-family:inherit}
  .primary{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#0A1A35;box-shadow:0 8px 24px rgba(214,158,46,.3)}
  .secondary{background:transparent;color:#1a365d;border:2px solid #1a365d}
  .secondary-gold{background:transparent;color:#fde68a;border:2px solid rgba(251,191,36,.4);background:#0A1A35;padding:.75rem 1.4rem}
  .ghost{background:transparent;color:#1a365d;padding:.5rem .75rem;font-weight:500}
  .line{background:#06c755;color:#fff;padding:.625rem 1rem;font-size:13px}
  .line svg{width:18px;height:18px}
  .dark-row{background:#0A1A35;border-radius:14px;padding:14px;display:flex;gap:14px;align-items:center}
  .arrow{font-size:14px}
</style>
</head>
<body>
  <div class="group">
    <div class="lbl">Primary CTA (gold gradient) · Secondary (navy outline)</div>
    <div class="row">
      <button class="btn primary">預約一場對話<span class="arrow">→</span></button>
      <button class="btn secondary">先看看再說</button>
      <button class="btn ghost">了解更多</button>
    </div>
  </div>
  <div class="group">
    <div class="lbl">On dark hero · Gold outline secondary + LINE</div>
    <div class="dark-row">
      <button class="btn primary">預約免費診斷</button>
      <button class="btn secondary-gold">看看學員怎麼說</button>
      <button class="btn line"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 10.3c0-5.4-5.4-9.7-12-9.7S0 5 0 10.3c0 4.8 4.3 8.8 10 9.6.4.1.9.3 1.1.6.1.3.1.8.1 1.1l-.2 1c0 .3-.2 1.2 1 .6 1.3-.5 7-4.1 9.4-7C23.2 14.4 24 12.5 24 10.3z"/></svg> LINE 諮詢</button>
    </div>
  </div>
</body>
</html>
