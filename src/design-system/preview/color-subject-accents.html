<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Subject Accents</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#0A1A35;color:#faf5ef;padding:24px;font-size:13px}
  .label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#fbbf24;opacity:.85;font-weight:600;margin-bottom:14px}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .card{padding:14px;border-radius:14px;backdrop-filter:blur(4px)}
  .icn{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 10px rgba(26,54,93,.3);margin-bottom:10px}
  .icn svg{width:22px;height:22px}
  .ttl{font-weight:700;font-size:14px;margin-bottom:2px}
  .sub{font-size:11px;opacity:.55}
  .c-blue{background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(37,99,235,.1));border:1px solid rgba(96,165,250,.4)}
  .c-blue .icn{background:linear-gradient(135deg,#60a5fa,#3b82f6)}.c-blue .ttl{color:#bfdbfe}.c-blue .sub{color:#93c5fd}
  .c-em{background:linear-gradient(135deg,rgba(16,185,129,.2),rgba(13,148,136,.1));border:1px solid rgba(52,211,153,.4)}
  .c-em .icn{background:linear-gradient(135deg,#34d399,#14b8a6)}.c-em .ttl{color:#a7f3d0}.c-em .sub{color:#6ee7b7}
  .c-v{background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(124,58,237,.1));border:1px solid rgba(167,139,250,.4)}
  .c-v .icn{background:linear-gradient(135deg,#a78bfa,#8b5cf6)}.c-v .ttl{color:#ddd6fe}.c-v .sub{color:#c4b5fd}
  .c-o{background:linear-gradient(135deg,rgba(249,115,22,.2),rgba(217,119,6,.1));border:1px solid rgba(251,146,60,.4)}
  .c-o .icn{background:linear-gradient(135deg,#fb923c,#f59e0b)}.c-o .ttl{color:#fed7aa}.c-o .sub{color:#fdba74}
  .hex{font-size:10px;font-family:ui-monospace,Menlo,monospace;margin-top:8px;opacity:.55}
</style>
</head>
<body>
  <div class="label">四領域語意輔色 · 僅作為識別，不作主品牌色</div>
  <div class="row">
    <div class="card c-blue"><div class="icn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1z"/></svg></div><div class="ttl">閱讀理解</div><div class="sub">邏輯思考訓練</div><div class="hex">#3b82f6</div></div>
    <div class="card c-em"><div class="icn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></div><div class="ttl">寫作表達</div><div class="sub">創意思維培養</div><div class="hex">#10b981</div></div>
    <div class="card c-v"><div class="icn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg></div><div class="ttl">古文素養</div><div class="sub">經典智慧傳承</div><div class="hex">#8b5cf6</div></div>
    <div class="card c-o"><div class="icn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg></div><div class="ttl">考試策略</div><div class="sub">精準答題技巧</div><div class="hex">#f59e0b</div></div>
  </div>
</body>
</html>
