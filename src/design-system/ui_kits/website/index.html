<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>立霖國文 · 官網 UI Kit</title>
<link rel="icon" href="../../assets/favicon.ico">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="motifs.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="brand-1.jsx"></script>
<script type="text/babel" src="brand-2.jsx"></script>
<script type="text/babel" src="hero.jsx"></script>
<script type="text/babel" src="screen-home.jsx"></script>
<script type="text/babel" src="screen-students.jsx"></script>
<script type="text/babel" src="screen-parents.jsx"></script>
<script type="text/babel" src="screen-activities.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

function App() {
  const [route, setRoute] = useState('home');

  // scroll to top on route change
  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [route]);

  const screens = {
    home: <Home setRoute={setRoute} />,
    students: <ForStudents setRoute={setRoute} />,
    parents: <ForParents setRoute={setRoute} />,
    activities: <Activities setRoute={setRoute} />,
  };

  return (
    <div data-screen-label={`${route === 'home' ? '01 Home' : route === 'students' ? '02 學生入口' : route === 'parents' ? '03 家長入口' : '04 體驗活動'}`}>
      <Navbar route={route} setRoute={setRoute} />
      {screens[route]}
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
